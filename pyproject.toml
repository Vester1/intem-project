[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "intem-a2a-kp2"
version = "0.0.2"
description = "Учебный прототип КП2: базовый граф и маршрутизация"
requires-python = ">=3.11"
dependencies = ["langgraph>=1.0,<2", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "pypdf>=5,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
intem-kp2 = "intem.cli:main"

[tool.setuptools.packages.find]
include = ["intem*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
